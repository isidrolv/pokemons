spring:
  application:
    name: pokemon-api-bff
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pokemon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

logging:
  structured:
    format:
      console: ecs

pokeapi:
  url: https://pokeapi.co/api/v2
