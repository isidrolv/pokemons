spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: pokemon-api-bff
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pokemon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

logging:
  file:
    name: logs/pokemon-api-bff.log

  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  structured:
    format:
      console: ecs
      file: ecs

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-components: always
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}

springdoc:
  show-actuator: true

pokemon:
  cache:
    provider: ${POKEMON_CACHE_PROVIDER:caffeine}
    page:
      ttl: ${POKEMON_CACHE_PAGE_TTL:5m}
      maximum-size: ${POKEMON_CACHE_PAGE_MAXIMUM_SIZE:128}
    detail:
      ttl: ${POKEMON_CACHE_DETAIL_TTL:15m}
      maximum-size: ${POKEMON_CACHE_DETAIL_MAXIMUM_SIZE:512}

pokeapi:
  url: https://pokeapi.co/api/v2
